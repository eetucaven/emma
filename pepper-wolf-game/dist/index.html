<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7cdb76" />
    <meta name="description" content="A tiny jumping game starring a wolf and three peppers." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237cdb76'/%3E%3Cpath d='M14 44c5-21 11-28 18-28l4-8 4 8c8 0 14 7 16 28-10 7-31 7-42 0Z' fill='%233f3d30'/%3E%3Ccircle cx='27' cy='31' r='4' fill='white'/%3E%3Ccircle cx='40' cy='31' r='4' fill='white'/%3E%3Ccircle cx='28' cy='31' r='1.5'/%3E%3Ccircle cx='41' cy='31' r='1.5'/%3E%3C/svg%3E" />
    <title>Wolf &amp; the Three Peppers</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #d9f7fc;
        color: #253523;
        font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
      }
      .game-shell { width: min(96vw, 1120px); padding: clamp(12px, 2.5vw, 26px) 0; }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin: 0 0 12px;
      }
      h1 { margin: 0; font-size: clamp(1.2rem, 3vw, 2rem); letter-spacing: .01em; }
      .score {
        padding: .48rem .8rem;
        background: #fff;
        border: 3px solid #70c96e;
        border-radius: 999px;
        font-weight: 800;
        white-space: nowrap;
        box-shadow: 0 3px 0 #a5e99e;
      }
      .stage {
        position: relative;
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border: 6px solid #fff;
        border-radius: 22px;
        background: #fff url("kettu-luonnossa-clean.png") center / cover no-repeat;
        box-shadow: 0 10px 0 #a2e59b, 0 16px 28px rgb(44 116 77 / .22);
        user-select: none;
        touch-action: none;
      }
      .stage::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, rgb(255 255 255 / .04), transparent 35%);
      }
      .pepper {
        position: absolute;
        width: clamp(28px, 4.2vw, 50px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        font-size: clamp(1.6rem, 3.4vw, 2.75rem);
        border: 0;
        padding: 0;
        background: transparent;
        filter: drop-shadow(0 2px 2px rgb(0 0 0 / .2));
        animation: bob 1.5s ease-in-out infinite;
        z-index: 3;
      }
      .pepper::before { content: "🫑"; }
      .pepper:nth-of-type(2) { animation-delay: -.35s; }
      .pepper:nth-of-type(3) { animation-delay: -.7s; }
      .pepper.collected { opacity: 0; transform: scale(1.8) rotate(20deg); transition: .28s ease-out; animation: none; pointer-events: none; }
      #pepper-1 { left: 7.8%; top: 42%; }
      #pepper-2 { left: 14%; top: 49%; }
      #pepper-3 { left: 39.7%; top: 43%; }
      .wolf {
        position: absolute;
        left: 66%;
        bottom: 19%;
        width: 16%;
        aspect-ratio: 1.5 / 1;
        z-index: 4;
        pointer-events: none;
        background-image: url("wolf-player.png");
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        filter: drop-shadow(0 4px 2px rgb(62 45 6 / .17));
        transform-origin: center bottom;
      }
      .wolf.facing-right { transform: scaleX(-1); }
      .hint {
        position: absolute;
        left: 50%;
        bottom: 3.4%;
        z-index: 5;
        transform: translateX(-50%);
        padding: .35rem .65rem;
        border-radius: 999px;
        background: rgb(255 255 255 / .87);
        color: #315131;
        font-size: clamp(.68rem, 1.5vw, .92rem);
        font-weight: 800;
        text-align: center;
        white-space: nowrap;
        box-shadow: 0 2px 0 rgb(101 193 94 / .45);
      }
      .message {
        position: absolute;
        inset: 0;
        z-index: 8;
        display: grid;
        place-items: center;
        background: rgb(255 255 255 / .78);
        opacity: 0;
        pointer-events: none;
        transition: opacity .25s ease;
      }
      .message.show { opacity: 1; pointer-events: auto; }
      .card {
        width: min(78%, 390px);
        padding: 1.5rem;
        text-align: center;
        background: #fffef4;
        border: 4px solid #74cf72;
        border-radius: 24px;
        box-shadow: 0 8px 0 #a8e99f;
      }
      .card strong { display: block; font-size: clamp(1.35rem, 4vw, 2rem); }
      .card p { margin: .6rem 0 1rem; font-size: 1rem; }
      button { font: inherit; }
      .restart, .controls button {
        cursor: pointer;
        border: 3px solid #40773c;
        background: #85df7c;
        color: #183b18;
        font-weight: 900;
        box-shadow: 0 3px 0 #40773c;
      }
      .restart { padding: .55rem .9rem; border-radius: 999px; }
      .restart:active, .controls button:active { transform: translateY(3px); box-shadow: none; }
      .controls { display: flex; justify-content: center; gap: .65rem; margin: 18px 0 0; }
      .controls button { min-width: 58px; min-height: 48px; border-radius: 14px; font-size: 1.1rem; }
      .controls .jump { min-width: 100px; background: #d86af1; border-color: #873b9b; color: #fff; box-shadow: 0 3px 0 #873b9b; }
      .controls button:focus-visible, .restart:focus-visible { outline: 4px solid #ffbd38; outline-offset: 3px; }
      @keyframes bob { 50% { transform: translateY(-7px) rotate(-6deg); } }
      @media (max-width: 560px) {
        .game-shell { width: 100vw; padding: 8px; }
        .stage { border-width: 3px; border-radius: 14px; }
        .hint { bottom: 2%; font-size: .62rem; }
        .topbar { margin-bottom: 8px; }
      }
      @media (prefers-reduced-motion: reduce) { .pepper { animation: none; } * { scroll-behavior: auto !important; } }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <header class="topbar">
        <h1>Wolf &amp; the Three Peppers</h1>
        <output id="score" class="score" aria-live="polite">Peppers: 0 / 3</output>
      </header>
      <section id="stage" class="stage" aria-label="Wolf pepper jumping game" tabindex="0">
        <button id="pepper-1" class="pepper" aria-label="Pepper one"></button>
        <button id="pepper-2" class="pepper" aria-label="Pepper two"></button>
        <button id="pepper-3" class="pepper" aria-label="Pepper three"></button>
        <div id="wolf" class="wolf" aria-label="The wolf"></div>
        <div id="hint" class="hint">← → to run &nbsp; • &nbsp; Space to jump</div>
        <div id="message" class="message" role="dialog" aria-modal="true" aria-label="You won">
          <div class="card">
            <strong>All three peppers! 🌟</strong>
            <p>The wolf made a very tasty discovery.</p>
            <button id="restart" class="restart">Play again</button>
          </div>
        </div>
      </section>
      <nav class="controls" aria-label="Game controls">
        <button type="button" data-action="left" aria-label="Run left">←</button>
        <button type="button" class="jump" data-action="jump">Jump</button>
        <button type="button" data-action="right" aria-label="Run right">→</button>
      </nav>
    </main>
    <script>
      const stage = document.querySelector('#stage');
      const wolf = document.querySelector('#wolf');
      const score = document.querySelector('#score');
      const hint = document.querySelector('#hint');
      const message = document.querySelector('#message');
      const restart = document.querySelector('#restart');
      const peppers = [...document.querySelectorAll('.pepper')];
      const held = new Set();
      let x, y, velocityY, collected, won, lastTime;
      // The wolf's paws are now on the green grass, not at the bottom edge.
      const floor = 19;
      const pepperPositions = [
        { x: 7.8, y: 42 }, { x: 14, y: 49 }, { x: 39.7, y: 43 }
      ];
      function reset() {
        x = 66; y = floor; velocityY = 0; collected = 0; won = false; lastTime = performance.now();
        peppers.forEach(pepper => pepper.classList.remove('collected'));
        score.textContent = 'Peppers: 0 / 3';
        message.classList.remove('show');
        hint.hidden = false;
        stage.focus();
        requestAnimationFrame(loop);
      }
      function jump() {
        if (!won && y <= floor + .3) velocityY = 78;
      }
      function setAction(action, active) {
        if (action === 'jump' && active) jump();
        else if (active) held.add(action);
        else held.delete(action);
      }
      function collectPepper(index) {
        peppers[index].classList.add('collected');
        collected += 1;
        score.textContent = `Peppers: ${collected} / 3`;
        if (collected === 1) hint.hidden = true;
        if (collected === 3) {
          won = true;
          message.classList.add('show');
          restart.focus();
        }
      }
      function overlaps(index) {
        const target = pepperPositions[index];
        const wolfCenterX = x + 9;
        const wolfTop = 100 - y - 10;
        return Math.abs(wolfCenterX - (target.x + 2)) < 7.5 && Math.abs(wolfTop - (target.y + 3)) < 10;
      }
      function loop(now) {
        if (won) return;
        const dt = Math.min((now - lastTime) / 1000, .035);
        lastTime = now;
        const direction = (held.has('right') ? 1 : 0) - (held.has('left') ? 1 : 0);
        x = Math.max(-2, Math.min(83, x + direction * 30 * dt));
        if (direction) wolf.classList.toggle('facing-right', direction > 0);
        velocityY -= 112 * dt;
        y += velocityY * dt;
        if (y < floor) { y = floor; velocityY = 0; }
        wolf.style.left = `${x}%`;
        wolf.style.bottom = `${y}%`;
        peppers.forEach((pepper, i) => {
          if (!pepper.classList.contains('collected') && overlaps(i)) collectPepper(i);
        });
        requestAnimationFrame(loop);
      }
      window.addEventListener('keydown', event => {
        const action = ({ ArrowLeft: 'left', ArrowRight: 'right', ' ': 'jump', Spacebar: 'jump' })[event.key];
        if (!action) return;
        event.preventDefault();
        setAction(action, true);
      });
      window.addEventListener('keyup', event => {
        const action = ({ ArrowLeft: 'left', ArrowRight: 'right' })[event.key];
        if (action) setAction(action, false);
      });
      document.querySelectorAll('[data-action]').forEach(button => {
        const action = button.dataset.action;
        ['pointerdown', 'pointerup', 'pointercancel', 'pointerleave'].forEach(type => {
          button.addEventListener(type, event => {
            event.preventDefault();
            setAction(action, type === 'pointerdown');
          });
        });
      });
      restart.addEventListener('click', reset);
      reset();
    </script>
  </body>
</html>
